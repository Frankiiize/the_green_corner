<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Green Corner</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"
    rel="stylesheet">
</head>

<body>
  <super-header></super-header>
  <main>
    <section>
      <div class="hero">
        <div class="hero__content">
          <h1 class="hero__content--title">Tu esquina verde empieza aquí.</h1>
          <p class="hero__content--description">Plantas cultivadas sin prisa y maceteros hechos a mano por artesanas
            locales.
            Elegí, pedí, y te lo llevamos
            en 48 horas.</p>
          <div class="hero__content--actionBtns">
            <super-button text="Ver catálogo" variant="primary"></super-button>
            <super-button text="Ver catálogo" variant="primary" outline></super-button>
          </div>
          <div class="hero__content__info">
            <span>Envío 48 h</span>
            <span>Garantía de raíz 30 días</span>
            <span>Maceteros de barro local</span>
          </div>
        </div>
        <div class="hero__bg">
          <img src="/assets/png/hero-img.png" alt="Plantas decorativas">
        </div>
      </div>
    </section>

    <!-- <super-button text="Ver catálogo" variant="primary" outline></super-button>
    <super-button text="Ver catálogo" variant="secondary"></super-button>
    <super-button text="Ver catálogo" variant="tertiary"></super-button> -->
  </main>
  <script type="module" src="./main.js"></script>
</body>

</html>
